<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Vibzo</title>
<meta name="description" content="Vibzo : vidéos courtes, rencontres, emplois et boutiques en Afrique de l’Ouest, du Centre, de l’Est et en Azerbaïdjan.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vibzo">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#f4faff;--card2:#e9f5fe;--line:#cfe6f7;--txt:#0b2540;--mut:#5b7a99;--pink:#1e9be8;--vio:#0a7fd0;--like:#ff3b5c;--gold:#e0a800;--green:#13a86b;--grad:linear-gradient(135deg,#5ccbff,#1e9be8);--goldg:linear-gradient(135deg,#ffe28a,#f7c948 45%,#c8901b);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e3f3fd;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--vio)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink);flex:none}
input[type=file]{padding:10px;font-size:13px}
svg{width:24px;height:24px;flex:none}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0 0 calc(62px + var(--sb)) 0;overflow-y:auto;display:none;padding-bottom:24px}
.screen.on{display:block}
#s-home{padding:0;overflow:hidden}
#s-chat{display:none;flex-direction:column;padding:0;overflow:hidden}
#s-chat.on{display:flex}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(62px + var(--sb));padding-bottom:var(--sb);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:20}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#8aa3bb;width:64px}
#nav button.on{color:var(--vio);font-weight:700}
#nav button.gold.on,#nav button.gold.on svg{color:var(--gold)}
#nav .plus{width:52px;height:34px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:-3px 0 0 #9be3ff,3px 0 0 #0a6fc2}
#nav .plus svg{color:#fff}
/* header */
.hdr{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:calc(12px + var(--st)) 16px 12px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:20px;font-weight:800;flex:1}
.hdr .ib{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;position:relative}
.hdr .ib svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--like);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.loc{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pad{padding:0 16px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;margin-top:16px}
.btn.gold{background:var(--goldg);color:#2a1d00}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:10px 12px;font-size:13px;margin-top:0;border-radius:12px}
.btn:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:12px;line-height:1.4}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:48px;margin-bottom:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--vio);box-shadow:0 2px 8px rgba(30,155,232,.18)}
.seg.goldseg button.on{background:var(--goldg);color:#2a1d00}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none;background:var(--grad);color:#fff}
/* feed */
#topbar{color:#fff;position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(10px + var(--st)) 12px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#topbar .tabs{display:flex;gap:12px;font-weight:700;font-size:14.5px;white-space:nowrap}
#topbar .tabs button{color:rgba(255,255,255,.6);padding-bottom:4px;border-bottom:2.5px solid transparent}
#topbar .tabs button.on{color:#fff;border-color:#fff}
#topbar .loc{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.15);font-size:12px;padding:6px 10px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
#topbar .rt{display:flex;gap:8px}
#topbar .ib{width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
#topbar .ib svg{width:22px;height:22px}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#0b2540;color:#fff}
.vbg{position:absolute;inset:0;background:linear-gradient(160deg,var(--g1),var(--g2),var(--g3));background-size:300% 300%;animation:gmove 9s ease infinite}
video.vbg{width:100%;height:100%;object-fit:cover;background:#000;animation:none}
.vbg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 45%),linear-gradient(transparent 55%,rgba(0,0,0,.65))}
@keyframes gmove{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
.vemoji{position:absolute;left:50%;top:34%;font-size:110px;transform:translate(-50%,-50%);animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-60%) rotate(4deg)}}
.vtitle{position:absolute;left:24px;right:80px;top:52%;font-size:24px;font-weight:800;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.slide.paused .vbg,.slide.paused .vemoji,.slide.paused .prog i,.slide.paused .disc{animation-play-state:paused}
.vtap{position:absolute;inset:0;z-index:1}
.pauseIc{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:60px;opacity:0;pointer-events:none;transition:.2s;z-index:2;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.slide.paused .pauseIc{opacity:.85}
.rail{position:absolute;right:8px;bottom:22px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail .av{width:46px;height:46px;border:2px solid #fff;position:relative;margin-bottom:8px}
.fol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
.fol.on{background:#fff;color:var(--vio);font-size:12px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rb svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.rb.on svg{fill:var(--like);stroke:var(--like);animation:pop .35s}
.rb.on2 svg{fill:var(--gold);stroke:var(--gold);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3)}}
.disc{width:42px;height:42px;border-radius:50%;border:8px solid #222;display:flex;align-items:center;justify-content:center;font-size:12px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vinfo{position:absolute;left:14px;right:78px;bottom:18px;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.vauth{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vloc{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px}
.vgold{font-size:11px;background:var(--goldg);color:#2a1d00;padding:2px 7px;border-radius:8px;text-shadow:none}
.vcap{font-size:14px;line-height:1.4;margin-top:6px}
.vcap b{font-weight:700}
.vprod{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:#111;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:9px;text-shadow:none}
.vsnd{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}
.vsnd svg{width:15px;height:15px}
.marq{overflow:hidden;white-space:nowrap;max-width:200px}
.marq span{display:inline-block;padding-left:100%;animation:marq 9s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2);z-index:3}
.prog i{display:block;height:100%;width:0;background:#fff;animation:prog 15s linear infinite}
@keyframes prog{to{width:100%}}
.burst{position:absolute;font-size:90px;transform:translate(-50%,-50%);animation:burst .8s forwards;pointer-events:none;z-index:5}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(-15deg);opacity:1}100%{transform:translate(-50%,-140%) scale(1) rotate(-15deg);opacity:0}}
.endslide{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,#d9f1ff,#ffffff 70%);color:var(--txt)}
/* sheet */
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.25s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1)}
#sheetBg.on #sheet{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;font-weight:800;font-size:16px;border-bottom:1px solid var(--line)}
.sh-b{overflow-y:auto;padding:12px 16px calc(20px + var(--sb))}
.clist{display:flex;flex-direction:column;gap:16px;padding:4px 0 10px}
.cm{display:flex;gap:10px}
.cm .av{width:34px;height:34px;font-size:14px}
.cm .n{font-size:12.5px;color:var(--mut);font-weight:600}
.cm .t{font-size:14px;margin-top:2px;line-height:1.35}
.cm .lk{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut)}
.cm .lk svg{width:18px;height:18px}
.cm .lk.on svg{fill:var(--like);stroke:var(--like)}
.cinput{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:10px}
.cinput button{width:46px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cinput svg{width:20px;height:20px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center;font-size:11.5px}
.sgrid button{display:flex;flex-direction:column;align-items:center;gap:6px}
.sgrid .ci{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card2)}
/* modal & toast */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:24px}
#modal.on{display:flex}
#toast{position:absolute;left:50%;top:calc(70px + var(--st));transform:translate(-50%,-20px);background:#0b2540;color:#fff;font-weight:700;font-size:13.5px;padding:11px 16px;border-radius:14px;z-index:80;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* discover */
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;flex:1}
.search input{border:0;background:none;padding:11px 0}
.search svg{width:18px;height:18px;color:var(--mut)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.vth{color:#fff;aspect-ratio:3/4;position:relative;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.vth video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vth span{position:absolute;left:6px;bottom:5px;font-size:11.5px;font-weight:700;text-shadow:0 1px 3px #000}
/* create */
.up{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:block;cursor:pointer}
.up .big{font-size:38px}
.styles{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.styles button{flex:none;width:64px;height:84px;border-radius:14px;font-size:30px;border:2px solid transparent}
.styles button.on{border-color:#fff}
.prev{height:200px;border-radius:18px;overflow:hidden;position:relative;margin-top:12px;display:flex;align-items:center;justify-content:center;font-size:70px}
.prev video{width:100%;height:100%;object-fit:cover}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pink)}
.sw.on::after{left:21px}
/* vip */
.hero{margin:6px 16px 0;border-radius:24px;padding:24px 20px;background:radial-gradient(circle at 80% 0%,rgba(92,203,255,.35),transparent 55%),linear-gradient(160deg,#fff8e1,#ffffff);border:1px solid rgba(224,168,0,.45);text-align:center}
.hero .cr{font-size:52px}
.hero h2{font-size:26px;font-weight:800;color:#a87800}
.perks{display:grid;gap:10px;margin-top:16px;text-align:left}
.perks div{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.plans{display:grid;gap:10px}
.plan{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:left;position:relative}
.plan.on{border-color:var(--gold);background:#fff8e1}
.plan .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none}
.plan.on .rd{border:6px solid var(--gold)}
.plan .pp{font-weight:800;font-size:16px}
.plan .tag{position:absolute;top:-9px;right:14px;background:var(--goldg);color:#2a1d00;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px}
.goldbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.goldbar .cr{background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.safety{display:flex;gap:10px;align-items:center;background:rgba(19,168,107,.08);border:1px solid rgba(19,168,107,.3);color:#0d6b45;border-radius:14px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.stack{position:relative;height:430px;margin-top:14px}
.dcard{position:absolute;inset:0;color:#fff;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--g1),var(--g2));transition:transform .3s,opacity .3s;touch-action:pan-y;user-select:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dcard.b1{transform:scale(.95) translateY(14px);opacity:.8}
.dcard.b2{transform:scale(.9) translateY(28px);opacity:.5}
.dcard .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:rgba(255,255,255,.9)}
.dcard .vibe{position:absolute;top:16px;left:16px;font-size:30px}
.dcard .more{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);font-weight:800}
.dcard .inf{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.dcard .nm{font-size:26px;font-weight:800}
.dcard .nm small{font-weight:500;font-size:22px}
.dcard .ver{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1e9bff;font-size:12px;vertical-align:middle;margin-left:4px}
.dcard .bio{font-size:13.5px;margin-top:6px;line-height:1.4;opacity:.95}
.int{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.int span{font-size:12px;background:rgba(255,255,255,.18);padding:5px 9px;border-radius:12px;font-weight:600}
.intent{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:10px;margin-top:8px}
.stamp{position:absolute;top:40px;font-size:34px;font-weight:800;padding:6px 14px;border:4px solid;border-radius:12px;opacity:0;transition:.15s}
.stamp.l{left:24px;color:var(--green);transform:rotate(-14deg)}
.stamp.n{right:24px;color:var(--like);transform:rotate(14deg)}
.dcard[data-dir=like] .stamp.l,.dcard[data-dir=nope] .stamp.n{opacity:1}
.dbtns{display:flex;justify-content:center;gap:22px;margin-top:20px}
.dbtns button{width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.dbtns .x{color:var(--like)}
.dbtns .s{width:50px;height:50px;align-self:center;color:#3db8ff;font-size:20px}
.dbtns .h{background:var(--grad);border:0;color:#fff}
.matches{display:flex;gap:12px;overflow-x:auto;padding:2px 0 4px}
.matches button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;flex:none}
.matches .av{width:56px;height:56px;border:2px solid var(--gold);font-size:20px}
.match{text-align:center;max-width:340px}
.match h2{font-size:34px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.match .pair{display:flex;justify-content:center;margin:24px 0}
.match .pair .av{width:96px;height:96px;font-size:38px;border:3px solid #fff}
.match .pair .av+.av{margin-left:-18px}
/* jobs */
.jlist{display:grid;gap:12px;margin-top:14px}
.job .t{font-weight:800;font-size:16px}
.job .co{font-size:13.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px}
.vchk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1e9bff;color:#fff;font-size:10px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;background:var(--card2);border:1px solid var(--line);padding:5px 9px;border-radius:10px;font-weight:600}
.tags span.g{color:var(--green);border-color:rgba(19,168,107,.35)}
.jact{display:flex;gap:8px;margin-top:12px}
.jact .btn{margin:0}
.dots{width:42px;flex:none;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800}
/* shop */

function go(k){
  if(k!==S.cur&&!['chat'].includes(k))S.prev=S.cur;
  S.cur=k;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#s-'+k).classList.add('on');

  ({home:renderHome,discover:renderDiscover,create:renderCreate,vip:renderVip,shop:renderShop,profile:renderProfile,msgs:renderMsgs,chat:renderChat,admin:renderAdmin})[k]();
  renderNav();
}

function sheet(title,body){$('#sheet').innerHTML=`<div class="sh-h"><span>${title}</span><button onclick="closeSheet()" aria-label="Fermer">${I.close}</button></div><div class="sh-b">${body}</div>`;$('#sheetBg').classList.add('on')}

function locChips(){$('#ccChips').innerHTML=Object.keys(ZN).map(z=>`<div style="width:100%;font-size:12.5px;font-weight:700;margin:6px 0 2px">${ZN[z]}</div>`+Object.entries(C).filter(([k,c])=>c.z===z).map(([k,c])=>`<button class="chip ${k===S.country?'on':''}" onclick="S.country='${k}';S.region='all';locChips()">${c.f} ${c.n}</button>`).join('')).join('');
$('#rgChips').innerHTML=`<button class="chip ${S.region==='zone'?'on':''}" onclick="S.region='zone';locChips()">🌍 Toute ma zone</button><button class="chip ${S.region==='all'?'on':''}" onclick="S.region='all';locChips()">Tout le pays</button>`+C[S.country].r.map((r,i)=>`<button class="chip ${S.region===r?'on':''}" onclick="S.region=C[S.country].r[${i}];locChips()">${r}</button>`).join('')}

function setTab(t){S.tab=t;renderHome()}
function feedList(){if(S.tab==='abo')return VIDEOS.filter(v=>S.follow.has(v.handle)||v.mine);return VIDEOS.filter(v=>inZone(v)||(v.mine&&v.cc===S.country))}
function slideHTML(v){
  const lk=S.liked.has(v.id),sv_=S.saved.has(v.id),fo=S.follow.has(v.handle),p=v.prod!=null?P(v.prod):null;
  return `<div class="slide" data-id="${v.id}">
  ${v.src?`<video class="vbg" src="${v.src}" loop muted playsinline></video>`:`<div class="vbg" style="${gstyle(v.g)}"></div><div class="vemoji">${v.e}</div><div class="vtitle">${esc(v.t)}</div>`}
  <div class="vtap" onclick="tapVid(event,${v.id})"></div><div class="pauseIc">▶</div>
  <div class="rail">
    <div class="av" style="${gbg(v.g)}">${esc(v.author[0])}${v.mine?'':`<button class="fol ${fo?'on':''}" onclick="toggleFollow(${v.id})" aria-label="Suivre">${fo?'✓':'+'}</button>`}</div>
    <button class="rb ${lk?'on':''}" id="lk${v.id}" onclick="toggleLike(${v.id})">${I.heart}<span>${fmtN(v.likes+(lk?1:0))}</span></button>
    <button class="rb" onclick="openComments(${v.id})">${I.comment}<span id="cc${v.id}">${fmtN(v.cn)}</span></button>
    <button class="rb ${sv_?'on2':''}" id="sv${v.id}" onclick="toggleSave(${v.id})">${I.bookmark}<span>${fmtN(v.saves+(sv_?1:0))}</span></button>
    <button class="rb" onclick="openShare(${v.id})">${I.share}<span>${fmtN(v.shares)}</span></button>
    <div class="disc" style="${gbg(v.g)}">♪</div>
  </div>
  <div class="vinfo">
    <div class="vauth">${esc(v.handle)}${v.mine&&S.vip?'<span class="vgold">👑 Gold</span>':''}<span class="vloc">📍 ${esc(v.region)}</span></div>
    <div class="vcap">${esc(v.cap)} ${v.tags.map(t=>`<b>#${esc(t)}</b>`).join(' ')}</div>
    ${p?`<button class="vprod" onclick="openProduct(${p.id})">🛍️ ${esc(p.n)} · ${price(p.p,p.cc)}</button>`:''}
    <div class="vsnd">${I.music}<span class="marq"><span>${esc(v.snd)} · ${esc(v.author)}</span></span></div>
  </div><div class="prog"><i></i></div></div>`}
function renderHome(){
  $('#locHome').textContent=locLabel();
  $('#tabAbo').classList.toggle('on',S.tab==='abo');$('#tabPour').classList.toggle('on',S.tab==='pour');
  const rt=$('#topbar .rt').children;rt[0].innerHTML=I.search;rt[1].innerHTML=I.chat+(unread()?`<span class="badge">${unread()}</span>`:'');
  const l=feedList();
  let end;
  if(S.tab==='abo'&&!l.length)end=`<div class="big" style="font-size:54px">👥</div><h2 style="margin:10px 0 6px">Aucun abonnement</h2><p class="mut">Appuie sur le <b>+</b> d’un créateur dans « Pour toi » pour voir ses vidéos ici.</p><button class="btn" style="width:auto;padding:12px 22px" onclick="setTab('pour')">Découvrir des créateurs</button>`;
  else end=`<div style="font-size:54px">🎉</div><h2 style="margin:10px 0 6px">Tu as tout vu ${S.region==='all'?'':S.region==='zone'?'dans ta zone':'à '+esc(S.region)}</h2><p class="mut">Explore d’autres régions ou publie ta propre vidéo.</p><button class="btn" style="width:auto;padding:12px 22px" onclick="openLoc()">📍 Changer de zone</button><button class="btn ghost" style="width:auto;padding:12px 22px;margin-top:10px" onclick="go('create')">＋ Publier une vidéo</button>`;
  $('#feed').innerHTML=l.map(slideHTML).join('')+`<div class="slide endslide">${end}</div>`;
  $('#feed').scrollTop=0;observeVideos();
}
let io;
function observeVideos(){if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;if(e.isIntersecting&&S.cur==='home'&&!e.target.classList.contains('paused'))v.play().catch(()=>{});else v.pause()}),{threshold:.6});document.querySelectorAll('#feed .slide').forEach(s=>io.observe(s))}
let lastTap=0,tapT;
function tapVid(e,id){const now=Date.now(),sl=e.currentTarget.parentElement;
  if(now-lastTap<300){clearTimeout(tapT);lastTap=0;if(!S.liked.has(id))toggleLike(id);const r=sl.getBoundingClientRect(),h=document.createElement('div');h.className='burst';h.textContent='❤️';h.style.left=(e.clientX-r.left)+'px';h.style.top=(e.clientY-r.top)+'px';sl.appendChild(h);setTimeout(()=>h.remove(),800);return}
  lastTap=now;tapT=setTimeout(()=>{sl.classList.toggle('paused');const v=sl.querySelector('video');if(v)sl.classList.contains('paused')?v.pause():v.play().catch(()=>{})},300)}
function toggleLike(id){const v=V(id);S.liked.has(id)?S.liked.delete(id):S.liked.add(id);const b=$('#lk'+id);if(b){b.classList.toggle('on',S.liked.has(id));b.querySelector('span').textContent=fmtN(v.likes+(S.liked.has(id)?1:0))}}
function toggleSave(id){const v=V(id);const on=!S.saved.has(id);on?S.saved.add(id):S.saved.delete(id);const b=$('#sv'+id);if(b){b.classList.toggle('on2',on);b.querySelector('span').textContent=fmtN(v.saves+(on?1:0))}toast(on?'Ajouté aux favoris 🔖':'Retiré des favoris')}
function toggleFollow(id){const v=V(id);const on=!S.follow.has(v.handle);on?S.follow.add(v.handle):S.follow.delete(v.handle);document.querySelectorAll('.slide').forEach(sl=>{const x=V(+sl.dataset.id);if(x&&x.handle===v.handle){const f=sl.querySelector('.fol');if(f){f.classList.toggle('on',on);f.textContent=on?'✓':'+'}}});toast(on?'Tu suis '+v.handle:'Abonnement retiré')}
function cHTML(c,i,vid){return `<div class="cm"><div class="av" style="${gbg(GR[c.n.length%GR.length])}">${esc(c.n[0])}</div><div class="grow"><div class="n">${esc(c.n)}${c.me&&S.vip?' 👑':''}</div><div class="t">${esc(c.t)}</div><div class="n" style="font-weight:500;margin-top:4px">${esc(c.time)} · <button class="mut small" onclick="replyTo(${vid},${i})">Répondre</button></div></div><button class="lk ${c.on?'on':''}" onclick="likeC(${vid},${i},this)">${I.heart}<span>${c.l+(c.on?1:0)}</span></button></div>`}
function openComments(id){const v=V(id);sheet(`${fmtN(v.cn)} commentaires`,`<div class="clist" id="clist">${v.comments.map((c,i)=>cHTML(c,i,id)).join('')}</div><form class="cinput" onsubmit="addComment(event,${id})"><input id="cIn" placeholder="Ajouter un commentaire…" maxlength="200" autocomplete="off"><button aria-label="Envoyer">${I.send}</button></form>`)}
function likeC(vid,i,el){const c=V(vid).comments[i];c.on=!c.on;el.classList.toggle('on',c.on);el.querySelector('span').textContent=c.l+(c.on?1:0)}
function replyTo(vid,i){const inp=$('#cIn');inp.value='@'+V(vid).comments[i].n+' ';inp.focus()}
function addComment(e,id){e.preventDefault();const t=$('#cIn').value.trim();if(!t)return;const v=V(id);v.comments.unshift({n:S.me.name,t,time:'à l’instant',l:0,me:true});v.cn++;$('#clist').innerHTML=v.comments.map((c,i)=>cHTML(c,i,id)).join('');$('#cIn').value='';const cc=$('#cc'+id);if(cc)cc.textContent=fmtN(v.cn);$('#sheet .sh-h span').textContent=fmtN(v.cn)+' commentaires'}
function openShare(id){const v=V(id);sheet('Partager',`<div class="sgrid">${[['🔗','Copier le lien','copy'],['🟢','WhatsApp','x'],['🔵','Facebook','x'],['✉️','Message Vibzo','dm'],['🎭','Duo','duo'],['✂️','Stitch','duo'],['⬇️','Enregistrer','dl'],['🚩','Signaler','rep']].map(([e,l,a])=>`<button onclick="shareAct('${a}',${id},'${l}')"><span class="ci">${e}</span>${l}</button>`).join('')}</div>`)}
function shareAct(a,id,l){const v=V(id);closeSheet();
  if(a==='copy'){try{navigator.clipboard.writeText('https://vibzo.app/v/'+id).then(()=>toast('Lien copié 🔗'),()=>toast('vibzo.app/v/'+id))}catch(e){toast('vibzo.app/v/'+id)}v.shares++}
  else if(a==='dm'){openChatWith({key:'dm-'+v.handle,name:v.author,sub:v.handle,type:'dm',g:v.g});pushMsg(S.chatId,true,'🎬 Vidéo partagée : « '+v.t+' »')}
  else if(a==='duo'){toast(l+' : ouvre la caméra pour répondre à '+v.handle);go('create')}
  else if(a==='rep'){toast('Merci, la modération va examiner cette vidéo 🛡️')}
  else{v.shares++;toast('Partagé via '+l+' ✅')}}

function renderDiscover(){
  const tags={};VIDEOS.filter(v=>v.cc===S.country).forEach(v=>v.tags.forEach(t=>tags[t]=(tags[t]||0)+v.likes));
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $('#s-discover').innerHTML=`<div class="hdr"><button class="ib" onclick="go('home')" aria-label="Retour">${I.back}</button><div class="search">${I.search}<input id="q" placeholder="Rechercher vidéos, sons, créateurs…" value="${esc(S.q)}" oninput="S.q=this.value;discResults()"></div></div>
  <div class="pad"><div class="row" style="justify-content:space-between"><div class="lbl" style="margin:6px 0 8px">Tendances · ${C[S.country].f} ${C[S.country].n}</div>${''}</div><div class="chips">${top.map(([t,n])=>`<button class="chip" onclick="S.q='${t}';$('#q').value='${t}';discResults()">#${t} <span class="mut">${fmtN(n)}</span></button>`).join('')}</div>
  <div class="lbl">Défis de la semaine</div><div class="row" style="gap:10px;overflow-x:auto">${['💃 #VibzoDanceChallenge','🍲 #RecetteEn60s','💼 #MonPremierJob'].map((t,i)=>`<div class="card" style="flex:none;width:200px;${gbg(GR[i])};border:0"><b>${t}</b><div class="small" style="margin-top:6px;opacity:.9">${fmtN(rint(2e5,5e6))} vues</div></div>`).join('')}</div>
  <div class="lbl">Vidéos</div></div><div class="vgrid" id="dres"></div>`;discResults()}
function discResults(){const q=norm(S.q||'');const l=VIDEOS.filter(v=>v.cc===S.country||v.mine).filter(v=>!q||norm(v.cap+v.t+v.tags.join(' ')+v.handle+v.snd).includes(q));
  $('#dres').innerHTML=l.length?l.map(v=>`<button class="vth" style="${gstyle(v.g)}" onclick="openVideo(${v.id})">${v.src?`<video src="${v.src}" muted></video>`:v.e}<span>▷ ${fmtN(v.likes)}</span></button>`).join(''):`<div class="empty" style="grid-column:1/-1">Aucun résultat pour « ${esc(S.q)} »</div>`}

function dList(){return DATERS.filter(d=>inZone(d)&&!S.swiped.has(d.id)&&(d.intent===S.dmode||d.intent==='both')&&(S.dage==='all'||(S.dage==='a'&&d.age<=25)||(S.dage==='b'&&d.age>25&&d.age<=32)||(S.dage==='c'&&d.age>32)))}
function renderDating(){
  const b=$('#vipBody');
  if(S.blocked18){b.innerHTML=`<div class="empty"><div class="big">⛔</div><h3>Accès refusé</h3><p style="margin-top:8px">L’espace rencontres est strictement réservé aux personnes majeures. Tu peux continuer à profiter de la section Emplois et du reste de Vibzo.</p></div>`;return}
  if(!S.verified){b.innerHTML=`<div class="card" style="margin-top:14px"><div style="font-size:34px">🔞</div><h3 style="margin-top:6px">Vérification obligatoire</h3><p class="mut small" style="margin-top:6px">Pour la sécurité de tous, l’espace rencontres est réservé aux adultes dont l’identité est vérifiée.</p>
    <div class="field"><label>Date de naissance</label><input type="date" id="dob"></div>
    <div class="field"><label>Pièce d’identité nationale ou passeport</label><input type="file" accept="image/*" id="idf"></div>
    <div class="field"><label>Selfie de vérification</label><input type="file" accept="image/*" id="slf"></div>
    <label class="check"><input type="checkbox" id="c1"> Je certifie avoir 18 ans ou plus.</label>
    <label class="check"><input type="checkbox" id="c2"> J’accepte la charte : respect, consentement explicite, aucun échange tarifé, aucun contenu non consenti, signalement de tout comportement abusif.</label>
    <button class="btn gold" onclick="verifyAge()">Vérifier mon identité</button><p class="mut small" style="margin-top:10px;text-align:center">Démo : les fichiers ne sont envoyés nulle part.</p></div>`;return}
  const l=dList();const top=l.slice(0,3);
  b.innerHTML=`<div class="seg" style="margin-top:12px"><button class="${S.dmode==='serieux'?'on':''}" onclick="S.dmode='serieux';renderDating()">💍 Relation sérieuse</button><button class="${S.dmode==='libre'?'on':''}" onclick="S.dmode='libre';renderDating()">🔥 Sans lendemain</button></div>
  <div class="row" style="margin-top:10px;gap:8px;overflow-x:auto">${[['all','Tous âges'],['a','18–25'],['b','26–32'],['c','33+']].map(([k,l])=>`<button class="chip ${S.dage===k?'on':''}" onclick="S.dage='${k}';renderDating()">${l}</button>`).join('')}</div>
  ${S.matches.length?`<div class="lbl">Tes matchs (${S.matches.length})</div><div class="matches">${S.matches.map(id=>{const d=DATERS[id];return `<button onclick="chatDater(${id})"><span class="av" style="${gbg(d.g)}">${esc(d.n[0])}</span>${esc(d.n)}</button>`}).join('')}</div>`:''}
  <div class="safety">🛡️<span>Premier rendez-vous dans un lieu public, préviens un proche. Le consentement passe avant tout.</span></div>
  <div class="stack" id="stack">${top.length?top.map((d,i)=>dCard(d,i)).reverse().join(''):`<div class="empty card" style="height:100%;display:flex;flex-direction:column;justify-content:center"><div class="big">🌍</div><b>Plus de profils dans ta zone</b><p class="small" style="margin-top:6px">Élargis ta région ou change de mode.</p><button class="btn" onclick="openLoc()">📍 Changer de zone</button></div>`}</div>
  ${top.length?`<div class="dbtns"><button class="x" onclick="swipe('nope')" aria-label="Passer">✕</button><button class="s" onclick="swipe('super')" aria-label="Super like">★</button><button class="h" onclick="swipe('like')" aria-label="J’aime">♥</button></div>`:''}
  <div class="tog" style="margin-top:14px"><span>👻 Masquer mon profil rencontre</span><button class="sw ${S.hidden?'on':''}" onclick="S.hidden=!S.hidden;this.classList.toggle('on');toast(S.hidden?'Ton profil est masqué':'Ton profil est visible')"></button></div>`;
  bindSwipe()}
function dCard(d,i){const it=d.intent==='serieux'?['💍 Relation sérieuse','background:rgba(30,155,255,.85)']:d.intent==='libre'?['🔥 Sans lendemain','background:rgba(255,45,120,.85)']:['✨ Ouvert(e) aux deux','background:rgba(139,61,255,.85)'];
  return `<div class="dcard ${i===0?'top':'b'+i}" data-id="${d.id}" style="${gstyle(d.g)}"><div class="ph">${esc(d.n[0])}</div><span class="vibe">${d.vibe}</span>${i===0?`<button class="more" onclick="dMore(${d.id})">⋯</button>`:''}<div class="stamp l">J’AIME</div><div class="stamp n">NON</div>
  <div class="inf"><div class="nm">${esc(d.n)} <small>${d.age}</small>${d.ver?'<span class="ver">✓</span>':''}</div><div class="small">📍 ${esc(d.city)}, ${esc(d.region)} · à ${d.km} km</div><span class="intent" style="${it[1]}">${it[0]}</span><div class="bio">${esc(d.bio)}</div><div class="int">${d.ints.map(x=>`<span>${x}</span>`).join('')}</div></div></div>`}
function bindSwipe(){const c=document.querySelector('.dcard.top');if(!c)return;let sx=0,dx=0,dr=false;
  c.onpointerdown=e=>{if(e.target.closest('.more'))return;dr=true;sx=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
  c.onpointermove=e=>{if(!dr)return;dx=e.clientX-sx;c.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;c.dataset.dir=dx>40?'like':dx<-40?'nope':''};
  c.onpointerup=c.onpointercancel=()=>{if(!dr)return;dr=false;c.style.transition='';if(dx>100)swipe('like');else if(dx<-100)swipe('nope');else{c.style.transform='';c.dataset.dir=''}}}
function swipe(dir){const c=document.querySelector('.dcard.top');if(!c)return;const id=+c.dataset.id;c.style.transform=`translateX(${dir==='nope'?-500:500}px) rotate(${dir==='nope'?-25:25}deg)`;c.style.opacity='0';c.dataset.dir=dir==='nope'?'nope':'like';
  setTimeout(()=>{S.swiped.add(id);if(dir!=='nope'&&(dir==='super'||R()<.55)){S.matches.push(id);showMatch(id)}else if(dir==='super')toast('Super like envoyé ⭐');renderDating()},260)}
function showMatch(id){const d=DATERS[id];modal(`<div class="match"><h2>C’est un match !</h2><p class="mut">Toi et ${esc(d.n)} vous êtes plu mutuellement.</p><div class="pair"><div class="av" style="background:var(--grad)">${esc(S.me.name[0])}</div><div class="av" style="${gbg(d.g)}">${esc(d.n[0])}</div></div><button class="btn" onclick="closeModal();chatDater(${id})">💬 Envoyer un message</button><button class="btn ghost" onclick="closeModal()">Continuer à découvrir</button></div>`)}
function chatDater(id){const d=DATERS[id];openChatWith({key:'match-'+id,name:d.n,sub:'Match · '+d.city,type:'match',g:d.g,sys:'Vous avez matché ! Restez respectueux et ne partagez jamais d’argent ni de données sensibles.'})}
function dMore(id){const d=DATERS[id];sheet(esc(d.n),`<div class="slist" style="margin:0">${[['🚩','Signaler ce profil','r'],['🚫','Bloquer','b'],['🛡️','Conseils de sécurité','s']].map(([e,l,a])=>`<button onclick="dAct('${a}',${id})"><span class="e">${e}</span>${l}</button>`).join('')}</div>`)}
function dAct(a,id){closeSheet();if(a==='s'){sheet('Conseils de sécurité',`<div class="perks" style="margin:0">${['☕ Premier rendez-vous dans un lieu public','📲 Préviens un proche de l’heure et du lieu','💸 N’envoie jamais d’argent à un match','🙅 Le consentement est clair, explicite et révocable à tout moment','🚩 Signale tout comportement abusif ou suspect'].map(t=>`<div>${t}</div>`).join('')}</div>`);return}S.swiped.add(id);toast(a==='r'?'Profil signalé, merci 🛡️':'Profil bloqué');renderDating()}
function verifyAge(){const v=$('#dob').value;if(!v)return toast('Indique ta date de naissance');const b=new Date(v),n=new Date();let age=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))age--;
  if(age<18){S.blocked18=true;renderDating();return}if(!$('#c1').checked||!$('#c2').checked)return toast('Coche les deux cases pour continuer');
  const btn=document.querySelector('#vipBody .btn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Vérification en cours…';setTimeout(()=>{S.verified=true;toast('Identité vérifiée ✓');renderDating()},1400)}

function jobCard(j){const ap=S.applied.has(j.id);return `<div class="card job"><div class="row"><div class="grow"><div class="t">${esc(j.p)}</div><div class="co">${esc(j.co)} ${j.ver?'<span class="vchk">✓</span>':''}</div></div><span class="mut small">il y a ${j.d} j</span></div>

  $('#s-admin').innerHTML=hdr('Back-office','',"profile")+`<div class="pad"><div class="row" style="gap:8px;overflow-x:auto;padding-bottom:4px"><button class="chip ${adminZ==='all'?'on':''}" style="flex:none" onclick="adminZ='all';renderAdmin()">🌍 Toutes les zones</button>${Object.keys(ZN).map(z=>`<button class="chip ${adminZ===z?'on':''}" style="flex:none" onclick="adminZ='${z}';renderAdmin()">${ZN[z]}</button>`).join('')}</div>
  <div class="stats" style="margin-top:14px">${[['Utilisateurs',fmtN(users)],['Membres Gold',fmtN(gold)],['Vendeurs',fmtN(sellers)],['Revenus / mois (équiv.)',Math.round(revEur*0.6*655.96).toLocaleString('fr-FR')+' FCFA'],['Vidéos publiées',fmtN(Math.round(4.2e6*f))],['Offres d’emploi',fmtN(Math.round(31800*f))]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <div class="lbl">File de modération (${modQ.length})</div>${modQ.length?modQ.map((m,i)=>`<div class="mq"><span class="k">${m[0]}</span><div class="grow"><b style="font-size:14px">${m[1]}</b><div class="mut small">${esc(m[2])}</div></div><div class="acts"><button class="ok" onclick="modQ.splice(${i},1);toast('Approuvé ✅');renderAdmin()">OK</button><button class="ko" onclick="modQ.splice(${i},1);toast('Supprimé 🗑️');renderAdmin()">Suppr.</button></div></div>`).join(''):'<p class="mut small">File vide 🎉</p>'}
  <div class="lbl">Tarifs par pays</div><div class="card" style="padding:6px 12px"><table><tr><th>Pays</th><th>Gold / mois</th><th>Vendeur / mois</th></tr>${ccs.map(k=>`<tr><td>${C[k].f} ${C[k].n}</td><td>${subPrice(4.99,k)}</td><td>${subPrice(9.99,k)}</td></tr>`).join('')}</table></div>
  <div class="lbl">Derniers paiements</div>${['Orange Money','M-Pesa','MTN MoMo','Wave','Airtel Money'].map((p,i)=>{const k=['CI','KE','CM','SN','UG'][i];return `<div class="mq"><span class="k">💳</span><div class="grow"><b style="font-size:14px">${i%2?'Abonnement Vendeur':'Abonnement Gold'}</b><div class="mut small">${C[k].f} ${C[k].n} · ${p}</div></div><b>${subPrice(i%2?9.99:4.99,k)}</b></div>`}).join('')}</div>`}

/* ---------- inscription ---------- */
function onboard(step){if(step===2){const tel=$('#obTel').value.replace(/\D/g,'');if(tel.length<6)return toast('Numéro de téléphone invalide');S.country=$('#obCc').value;S.region='all';
  $('#modal').innerHTML=`<div class="card" style="max-width:360px;width:100%;text-align:center"><div style="font-size:40px">📲</div><h3 style="margin-top:6px">Code envoyé</h3><p class="mut small" style="margin-top:6px">Saisis le code reçu par SMS ou WhatsApp au ${C[S.country].tel} ${esc(tel)} (démo : n’importe quel code).</p><input id="obCode" inputmode="numeric" maxlength="6" placeholder="• • • • • •" style="text-align:center;font-size:22px;letter-spacing:.3em;margin-top:14px"><button class="btn" onclick="onboard(3)">Valider</button></div>`;return}
  if(step===3){if(($('#obCode').value||'').length<4)return toast('Saisis le code à 4 chiffres ou plus');closeModal();toast('Bienvenue sur Vibzo '+C[S.country].f);refresh();return}
  modal(`<div class="card" style="max-width:360px;width:100%"><div class="logo" style="text-align:center;font-size:34px"><span>Vibzo</span></div><p class="mut small" style="text-align:center;margin-top:6px">Disponible en Afrique de l’Ouest, du Centre, de l’Est et en Azerbaïdjan</p><p class="small" style="text-align:center;margin-top:8px;background:rgba(247,201,72,.12);color:#8a6100;border-radius:10px;padding:8px">Version de démonstration : contenus fictifs, aucun paiement réel, aucune donnée envoyée.</p>
  <div class="field"><label>Ton pays</label><select id="obCc" onchange="$('#obInd').textContent=C[this.value].tel">${Object.keys(ZN).map(z=>`<optgroup label="${ZN[z]}">${Object.entries(C).filter(([k,c])=>c.z===z).map(([k,c])=>`<option value="${k}" ${k===S.country?'selected':''}>${c.f} ${c.n}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div class="field"><label>Numéro de téléphone</label><div class="row"><span class="chip" id="obInd" style="flex:none">${C[S.country].tel}</span><input id="obTel" type="tel" inputmode="tel" placeholder="6 12 34 56 78"></div></div>
  <button class="btn" onclick="onboard(2)">Recevoir le code</button><p class="mut small" style="text-align:center;margin-top:10px">En continuant, tu acceptes la <a href="privacy.html" style="color:var(--txt)">politique de confidentialité</a>.</p></div>`)}
/* ---------- init ---------- */
go('home');if(firstRun)onboard(1);
try{if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
