<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Vibzo</title>
<meta name="description" content="Vibzo : vidéos courtes, emplois et boutiques en Afrique de l’Ouest, du Centre, de l’Est et en Azerbaïdjan.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vibzo">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div id="app">
  <section class="screen on" id="s-home"><div class="loading" style="height:100%"><span class="spin"></span>Chargement…</div></section>
  <section class="screen" id="s-auth"></section>
  <section class="screen" id="s-discover"></section>
  <section class="screen" id="s-create"></section>
  <section class="screen" id="s-dating"></section>
  <section class="screen" id="s-jobs"></section>
  <section class="screen" id="s-shop"></section>
  <section class="screen" id="s-orders"></section>
  <section class="screen" id="s-profile"></section>
  <section class="screen" id="s-msgs"></section>
  <section class="screen" id="s-chat"></section>
  <section class="screen" id="s-admin"></section>
  <nav id="nav"></nav>
  <div id="sheetBg" onclick="if(event.target.id==='sheetBg')V.closeSheet()"><div id="sheet"></div></div>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="main.js?v=11"></script>
<script>
  if ('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
